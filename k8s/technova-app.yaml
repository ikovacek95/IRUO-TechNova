# =====================================================================
#  TechNova Solutions - demo aplikacija na Azure Kubernetes Service
#  Dokazuje spremnost okruzenja za buducu migraciju aplikacije na kontejnere.
#
#  Primjena:  kubectl apply -f k8s/
#  Provjera:  kubectl get all -n technova
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: technova
  labels:
    tvrtka: technova-solutions
    okruzenje: prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: technova-web-content
  namespace: technova
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="hr">
    <head><meta charset="utf-8"><title>TechNova Solutions - AKS</title>
    <style>
      body{font-family:Segoe UI,sans-serif;background:#f3f2f1;text-align:center;padding:60px}
      .card{background:#fff;max-width:620px;margin:0 auto;padding:40px;border-radius:8px;
            box-shadow:0 2px 12px rgba(0,0,0,.12)}
      h1{color:#0078d4;margin-bottom:4px}
      .meta{color:#605e5c;font-size:14px;line-height:1.8;margin-top:20px}
    </style></head>
    <body><div class="card">
      <h1>TechNova Solutions</h1>
      <p>Kontejnerizirana aplikacija na Azure Kubernetes Service</p>
      <div class="meta">
        Horizontal Pod Autoscaler: 2 &ndash; 6 podova<br>
        Cluster Autoscaler: 1 &ndash; 3 cvora<br>
        Container Insights salje metrike u Log Analytics
      </div>
    </div></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technova-web
  namespace: technova
  labels:
    app: technova-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technova-web
  template:
    metadata:
      labels:
        app: technova-web
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          # Zahtjevi i ogranicenja resursa su preduvjet za rad HPA autoscalera
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
      volumes:
        - name: web-content
          configMap:
            name: technova-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: technova-web-svc
  namespace: technova
  annotations:
    # Interni load balancer - aplikacija nije izlozena Internetu izravno
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: technova-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: technova-web-hpa
  namespace: technova
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: technova-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: technova-web-netpol
  namespace: technova
spec:
  # Zero-trust unutar klastera: dopusten je samo HTTP promet prema web podovima
  podSelector:
    matchLabels:
      app: technova-web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
